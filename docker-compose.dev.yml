# ============================================================================
# Standalone local development compose file.
# Usage:  docker compose -f docker-compose.dev.yml up -d --build
#
# Runs independently from production — no port 80/443 conflict.
# Access at http://localhost:3000 (Next.js directly, bypasses nginx).
# ============================================================================

services:

  # ---- PostgreSQL database ---------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: toc-portal-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toc_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-toc_db}
    volumes:
      - db-data-dev:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  # ---- The Portal (Next.js app) ---------------------------------------------
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: toc-portal-dev
    container_name: toc-portal-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-toc_user}:${POSTGRES_PASSWORD:-toc_password_change_me}@db:5432/${POSTGRES_DB:-toc_db}
      AUTH_SECRET: ${AUTH_SECRET:-please_set_a_long_random_auth_secret}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - uploads-data-dev:/app/public/uploads
      - ./ssl:/etc/nginx/ssl:ro

volumes:
  db-data-dev:
  uploads-data-dev:
