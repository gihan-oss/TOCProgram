# =============================================================================
# Rate-limiting zone (shared across all workers, 10 MB ≈ ~160k IPs tracked).
# =============================================================================
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;

# ---- Block map: known malicious user-agents ----
map $http_user_agent $block_ua {
  default                 0;
  "~*libredtail"          1;
  "~*sqlmap"              1;
  "~*nikto"               1;
  "~*nmap"                1;
  "~*masscan"             1;
  "~*gobuster"            1;
  "~*dirbuster"           1;
}

# ---- HTTP (port 80) → redirect to HTTPS ----
server {
  listen 80;
  server_name _;

  # Redirect all HTTP to HTTPS (except health check)
  location = /health {
    return 200 "ok";
    add_header Content-Type text/plain;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- HTTPS (port 443) ----
# Place your certificates in ./ssl/:
#   fullchain.pem  — certificate chain
#   privkey.pem    — private key
server {
  listen 443 ssl http2;
  server_name _;
  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;

  # ---- Modern TLS configuration ----
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # ---- Drop connections from known malicious user-agents ----
  if ($block_ua) {
    return 444;
  }

  # ---- Drop requests with suspicious query-string patterns ----
  if ($args ~* "(php://|expect://|/etc/passwd|/bin/bash|wget |curl |invokefunction|call_user_func_array|pearcmd|config-create|<?echo|<?php|eval\(|base64_decode|system\(|exec\(|passthru\(|shell_exec\(|proc_open\(|popen\()") {
    return 444;
  }

  # ---- Drop PHP/Docker/sensitive-file probes ----
  location ~* ^/(.*\.(php|asp|aspx|jsp|cgi)|\.git|\.env|\.svn|wp-admin|wp-login|wp-content|phpmyadmin|phpMyAdmin|mysql|mssql|containers/json|docker\.sock|actuator|api/v1/pods|\.DS_Store) {
    return 444;
  }

  location = /health {
    return 200 "ok";
    add_header Content-Type text/plain;
  }

  location /_next/static/ {
    limit_req zone=static burst=50 nodelay;
    alias /app/.next/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /public/ {
    limit_req zone=static burst=50 nodelay;
    alias /app/public/;
    expires 1d;
    add_header Cache-Control "public";
  }

  location / {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Security headers
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  }

  # ---- Custom 403/404 ----
  error_page 403 404 =444 /dev/null;
}
